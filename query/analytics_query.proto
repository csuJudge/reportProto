syntax = "proto3";
option go_package = "github.com/csuJudge/reportProto/query";

package oj.report;

import "common/analytics_common.proto";

service ReportQueryServer {
    // QueryEvents 查询通用事件
    rpc QueryEvents(QueryEventsReq) returns (QueryEventsRsp) {}
    // QueryProblemEnterEvents 查询进入题目事件
    rpc QueryProblemEnterEvents(QueryProblemEnterEventsReq) returns (QueryProblemEnterEventsRsp) {}
    // QuerySolutionSubmittedEvents 查询提交事件
    rpc QuerySolutionSubmittedEvents(QuerySolutionSubmittedEventsReq) returns (QuerySolutionSubmittedEventsRsp) {}
    // QuerySolutionResultUpdatedEvents 查询判题结果事件
    rpc QuerySolutionResultUpdatedEvents(QuerySolutionResultUpdatedEventsReq) returns (QuerySolutionResultUpdatedEventsRsp) {}
    // QueryRecommendationMetrics 查询推荐效果指标
    rpc QueryRecommendationMetrics(QueryRecommendationMetricsReq) returns (QueryRecommendationMetricsRsp) {}
    // QueryProblemEnterSourceDistribution 查询题目进入来源分布
    rpc QueryProblemEnterSourceDistribution(QueryProblemEnterSourceDistributionReq) returns (QueryProblemEnterSourceDistributionRsp) {}
    // QueryUserBehaviorTrace 查询用户行为轨迹
    rpc QueryUserBehaviorTrace(QueryUserBehaviorTraceReq) returns (QueryUserBehaviorTraceRsp) {}
    // QueryAttemptSeqDistribution 查询提交次数分布
    rpc QueryAttemptSeqDistribution(QueryAttemptSeqDistributionReq) returns (QueryAttemptSeqDistributionRsp) {}
    // 通用查询：query_name 为查询定义文件中预注册的查询名
    rpc QueryAnalytics(AnalyticsQueryReq) returns (AnalyticsQueryRsp) {}
}

message QueryEventsReq {
    string eventName = 1;  // 事件名
    int32 eventVersion = 2; // 事件结构版本
    string startTime = 3;  // 开始时间
    string endTime = 4;    // 结束时间
    repeated int32 createdBy = 5; // 用户编号列表
    repeated string reporter = 6; // 上报来源
    repeated EventPayloadFilter payloadFilters = 7; // payload 过滤条件
    bool includePayload = 8; // 是否返回 payload
    int32 offset = 9;      // 偏移量
    int32 limit = 10;      // 每页数量
}

message QueryEventsRsp {
    string message = 1; // 返回信息
    int32 code = 2;     // 返回码
    repeated EventRecord events = 3; // 事件列表
    int32 total = 4;    // 总数
}

message QueryProblemEnterEventsReq {
    string startTime = 1; // 开始时间
    string endTime = 2;   // 结束时间
    repeated int32 createdBy = 3; // 用户编号
    repeated int32 problemID = 4; // 题目编号
    string entrySource = 5; // 进入来源
    repeated string recommendationID = 6; // 推荐批次编号
    int32 offset = 7; // 偏移量
    int32 limit = 8;  // 每页数量
}

message ProblemEnterEvent {
    string eventID = 1;          // 事件编号
    string occurredAt = 2;       // 进入时间
    int32 createdBy = 3;         // 用户编号
    int32 problemID = 4;         // 题目编号
    string entrySource = 5;      // 进入来源
    string recommendationID = 6; // 推荐批次编号
    int32 contestID = 7;         // 作业或竞赛编号
    int32 courseID = 8;          // 课程编号
    string reporter = 9;         // 上报来源
    string payload = 10;         // 事件业务字段
}

message QueryProblemEnterEventsRsp {
    string message = 1; // 返回信息
    int32 code = 2;     // 返回码
    repeated ProblemEnterEvent events = 3; // 进入题目事件
    int32 total = 4;    // 总数
}

message QuerySolutionSubmittedEventsReq {
    string startTime = 1; // 开始时间
    string endTime = 2;   // 结束时间
    repeated int32 createdBy = 3; // 用户编号
    repeated int32 problemID = 4; // 题目编号
    repeated int32 solutionID = 5; // 提交编号
    repeated int32 contestID = 6; // 作业或竞赛编号
    int32 minAttemptSeq = 7; // 最小提交序号
    int32 maxAttemptSeq = 8; // 最大提交序号
    int32 offset = 9; // 偏移量
    int32 limit = 10; // 每页数量
}

message SolutionSubmittedEvent {
    string eventID = 1;    // 事件编号
    string occurredAt = 2; // 提交时间
    int32 createdBy = 3;   // 用户编号
    int32 problemID = 4;   // 题目编号
    int32 solutionID = 5;  // 提交编号
    int32 attemptSeq = 6;  // 第几次提交
    int32 contestID = 7;   // 作业或竞赛编号
    int32 courseID = 8;    // 课程编号
    int32 languageID = 9;  // 语言编号
    string reporter = 10;  // 上报来源
    string payload = 11;   // 事件业务字段
}

message QuerySolutionSubmittedEventsRsp {
    string message = 1; // 返回信息
    int32 code = 2;     // 返回码
    repeated SolutionSubmittedEvent events = 3; // 提交事件列表
    int32 total = 4;    // 总数
}

message QuerySolutionResultUpdatedEventsReq {
    string startTime = 1; // 开始时间
    string endTime = 2;   // 结束时间
    repeated int32 createdBy = 3; // 用户编号
    repeated int32 problemID = 4; // 题目编号
    repeated int32 solutionID = 5; // 提交编号
    repeated int32 contestID = 6; // 作业或竞赛编号
    repeated string result = 7; // 判题结果过滤，如 AC/WA/TLE
    int32 offset = 8; // 偏移量
    int32 limit = 9;  // 每页数量
}

message SolutionResultUpdatedEvent {
    string eventID = 1;     // 事件编号
    string occurredAt = 2;  // 结果更新时间
    int32 createdBy = 3;    // 用户编号
    int32 problemID = 4;    // 题目编号
    int32 solutionID = 5;   // 提交编号
    string result = 6;      // 判题结果
    int64 timeCostMs = 7;   // 运行时间（毫秒），缺失为 0
    int64 memoryCostKb = 8; // 内存占用（KB），缺失为 0
    string reporter = 9;    // 上报来源
    string payload = 10;    // 事件业务字段
}

message QuerySolutionResultUpdatedEventsRsp {
    string message = 1; // 返回信息
    int32 code = 2;     // 返回码
    repeated SolutionResultUpdatedEvent events = 3; // 判题结果事件列表
    int32 total = 4;    // 总数
}

message QueryRecommendationMetricsReq {
    string startTime = 1; // 开始时间
    string endTime = 2;   // 结束时间
    repeated string recommendationID = 3; // 推荐批次编号
}

message RecommendationMetrics {
    int64 exposedUsers = 1;  // 推荐曝光用户数
    int64 clickedUsers = 2;  // 推荐点击用户数
    int64 exposedProblems = 3; // 推荐曝光题目数
    int64 clickedProblems = 4; // 推荐点击题目数
    double clickRate = 5;  // 推荐点击率（点击用户数/曝光用户数，0-1）
}

message QueryRecommendationMetricsRsp {
    string message = 1; // 返回信息
    int32 code = 2;     // 返回码
    RecommendationMetrics metrics = 3; // 推荐效果指标
}

message QueryProblemEnterSourceDistributionReq {
    string startTime = 1; // 开始时间
    string endTime = 2;   // 结束时间
    repeated int32 createdBy = 3; // 用户编号
    repeated int32 problemID = 4; // 题目编号
}

message ProblemEnterSourceStat {
    string entrySource = 1; // 进入来源
    int64 enterCount = 2;   // 题目进入次数
    int64 userCount = 3;    // 独立用户数
}

message QueryProblemEnterSourceDistributionRsp {
    string message = 1; // 返回信息
    int32 code = 2;     // 返回码
    repeated ProblemEnterSourceStat distributions = 3; // 按来源分布
    int64 totalEnterCount = 4; // 进入总次数
}

message QueryUserBehaviorTraceReq {
    string startTime = 1; // 开始时间
    string endTime = 2;   // 结束时间
    int32 createdBy = 3;  // 用户编号
    int32 problemID = 4;  // 题目编号，0 表示不过滤
    int32 limit = 5;      // 轨迹事件最大条数
}

message BehaviorTraceEvent {
    string eventName = 1; // 事件名
    string eventID = 2;   // 事件编号
    string occurredAt = 3; // 事件时间
    int32 problemID = 4;  // 关联题目编号，无关联为 0
    string payload = 5;   // 事件业务字段
}

message QueryUserBehaviorTraceRsp {
    string message = 1; // 返回信息
    int32 code = 2;     // 返回码
    repeated BehaviorTraceEvent events = 3; // 按时间正序的行为事件
    int32 total = 4;    // 总数
}

message QueryAttemptSeqDistributionReq {
    string startTime = 1; // 开始时间
    string endTime = 2;   // 结束时间
    repeated int32 createdBy = 3; // 用户编号
    repeated int32 problemID = 4; // 题目编号
    repeated int32 contestID = 5; // 作业或竞赛编号
}

message AttemptSeqStat {
    int32 attemptSeq = 1; // 提交次数序号
    int64 submitCount = 2; // 该次提交的提交数
    map<string, int32> resultCounts = 3; // 判题结果分布，result -> 次数
}

message QueryAttemptSeqDistributionRsp {
    string message = 1; // 返回信息
    int32 code = 2;     // 返回码
    repeated AttemptSeqStat distributions = 3; // 按提交次数分布
    int64 totalSubmitCount = 4; // 提交总数
}

message AnalyticsQueryReq {
    string queryName = 1;            // 预注册查询名
    map<string, string> params = 2;  // 查询参数，全部字符串，引擎按定义声明的类型转换校验
    int32 offset = 3;                // 分页偏移（聚合类查询无效）
    int32 limit = 4;                 // 每页数量（聚合类查询无效）
}

message AnalyticsColumnMeta {
    string name = 1;   // 列名（camelCase，前后端契约）
    string type = 2;   // string|int64|double|bool|datetime|json
    string label = 3;  // 中文列名（前端表头展示）
}

message AnalyticsValue {
    oneof value {
        string stringVal = 1;
        int64 intVal = 2;
        double doubleVal = 3;
        bool boolVal = 4;
        string jsonVal = 5;  // JSON 字符串：嵌套结构（resultCounts map、payload 等）
    }
}

message AnalyticsRow {
    repeated AnalyticsValue values = 1;  // 与 columns 顺序一一对应
}

message AnalyticsQueryRsp {
    string message = 1;
    int32 code = 2;                       // 复用现有错误码体系，新增「查询不存在」码
    repeated AnalyticsColumnMeta columns = 3;
    repeated AnalyticsRow rows = 4;
    int64 total = 5;                      // 明细类总行数（分页用）；聚合类恒为 0
}

